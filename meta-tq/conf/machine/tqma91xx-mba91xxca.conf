#@TYPE: Machine
#@NAME: i.MX91 TQMa91xxLA (ADAP) and TQMa91xxCA on MBa91xxCA
#@DESCRIPTION: TQ-Systems GmbH i.MX91 MBa91xxCA starter kit
#@MAINTAINER: Markus Niebel <oss@ew.tq-group.com>

require conf/machine/include/tqma91xx-common.inc
require conf/machine/include/mba91xx-common.inc

MACHINE_FEATURES += "\
    lte \
"

# Set u-boot DTB
UBOOT_DTB_NAME = "imx91-tqma9131-mba91xxca.dtb"

UBOOT_CONFIG ??= "\
    mfgtool \
    sd \
"

UBOOT_CONFIG[mfgtool] = "tqma91xx_mba91xxca_uuu_defconfig"
UBOOT_CONFIG[sd] = "tqma91xx_mba91xxca_defconfig,wic"

KERNEL_DEVICETREE = ""

KERNEL_DEVICETREE_linux-imx-tq = "\
    freescale/imx91-tqma9131-mba91xxca.dtb \
    freescale/imx91-tqma9131-mba91xxca-lvds-tm070jvhg33.dtb \
    freescale/imx91-tqma9131-mba91xxca-rgb-cdtech-dc44.dtb \
    freescale/imx91-tqma9131-mba91xxca-lvds-tm070jvhg33.dtbo \
    freescale/imx91-tqma9131-mba91xxca-rgb-cdtech-dc44.dtbo \
"

KERNEL_DEVICETREE += "${@kernel_provider_dtbs(d)}"

# Set the USB UART of the wwan card inserted into mini PCIe slot. Use this UART
# to send AT commands to the wwan card (see quectel-ppp recipe). This assignment
# must not contain spaces and line feeds.
QUECTEL_PPP_TTY = "/dev/serial/by-path/platform-ci_hdrc\.0-usb-0\:1\.2\:1\.2-port0"

# This example shows the APN to be used for NXTGN IoT SIM cards. Please uncomment
# and override with the the string needed for your provider.
# For further information see README in doc folder of this layer.
# QUECTEL_PPP_APN ?= "h.nxtgn"
