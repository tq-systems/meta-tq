#@TYPE: Machine
#@NAME: TQ-Systems GmbH TQMa6ULx[L] SOM with 256 / 512 MB RAM on MBa6ULx baseboard
#@SOC: i.MX6UL
#@DESCRIPTION: Machine configuration for TQ-Systems GmbH TQMaULx[L]
#@MAINTAINER: Markus Niebel <oss@ew.tq-group.com>

include conf/machine/include/tqma6ul.inc
include conf/machine/include/mba6ulx-common.inc

# legacy linux-imx
KERNEL_DEVICETREE_linux-imx-tq = "\
    imx6ul-mba6ulx.dtb \
    imx6ul-mba6ulx-g1.dtb \
    imx6ul-mba6ulx-dmb-ct21.dtb \
    imx6ul-mba6ulx-dmb-ct44.dtb \
    imx6ul-mba6ulx-glyn-etm0700g0edh6.dtb \
    imx6ul-mba6ulx-lvds.dtb \
    imx6ul-mba6ulx-lga.dtb \
    imx6ul-mba6ulx-lga-dmb-ct21.dtb \
    imx6ul-mba6ulx-lga-dmb-ct44.dtb \
    imx6ul-mba6ulx-lga-glyn-etm0700g0edh6.dtb \
    imx6ul-mba6ulx-lga-lvds.dtb \
"

KERNEL_DEVICETREE_linux-tq = "\
    imx6ul-tqma6ul1-mba6ulx.dtb \
    imx6ul-tqma6ul2-mba6ulx.dtb \
    imx6ul-tqma6ul2-mba6ulx-cdtech-dc44.dtb \
    imx6ul-tqma6ul2-mba6ulx-cdtech-fc21.dtb \
    imx6ul-tqma6ul2-mba6ulx-lvds.dtb \
    imx6ul-tqma6ul2l-mba6ulx.dtb \
    imx6ul-tqma6ul2l-mba6ulx-cdtech-dc44.dtb \
    imx6ul-tqma6ul2l-mba6ulx-cdtech-fc21.dtb \
    imx6ul-tqma6ul2l-mba6ulx-lvds.dtb \
"

KERNEL_DEVICETREE += "${@kernel_provider_dtbs(d)}"

UBOOT_CONFIG ?= "\
    sd \
    256mb_sd 256mb_qspi \
    256mb_sd_lga 256mb_qspi_lga \
    512mb_sd 512mb_qspi \
    512mb_sd_lga 512mb_qspi_lga \
    "

UBOOT_CONFIG[sd] = "tqma6ulx_mba6ul_mmc_defconfig,wic"

UBOOT_CONFIG[256mb_sd] = "tqma6ulx_mba6ul_mmc_defconfig"
UBOOT_CONFIG[256mb_qspi] = "tqma6ulx_mba6ul_qspi_defconfig"

UBOOT_CONFIG[256mb_sd_lga] = "tqma6ulxl_mba6ul_mmc_defconfig"
UBOOT_CONFIG[256mb_qspi_lga] = "tqma6ulxl_mba6ul_qspi_defconfig"

UBOOT_CONFIG[512mb_sd] = "tqma6ulx_512mb_mba6ul_mmc_defconfig"
UBOOT_CONFIG[512mb_qspi] = "tqma6ulx_512mb_mba6ul_qspi_defconfig"

UBOOT_CONFIG[512mb_sd_lga] = "tqma6ulxl_512mb_mba6ul_mmc_defconfig"
UBOOT_CONFIG[512mb_qspi_lga] = "tqma6ulxl_512mb_mba6ul_qspi_defconfig"

# allow creating multiple wic images for a single machine
IMAGE_CLASSES += "gen_additional_wic"
# Workaround for gen_additional_wic, remove after conversion / compression is handled in class
TQ_IMAGE_COMPRESSION = ""

EXTWIC_BOOTLOADER_IMAGES = "\
    u-boot-${MACHINE}.imx-256mb_sd \
    u-boot-${MACHINE}.imx-512mb_sd \
    u-boot-${MACHINE}.imx-256mb_sd_lga \
    u-boot-${MACHINE}.imx-512mb_sd_lga \
"
