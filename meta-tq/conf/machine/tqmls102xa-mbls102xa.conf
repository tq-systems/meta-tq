#@TYPE: Machine
#@NAME: TQ-Systems GmbH TQMLS102xA Module on MBLS102xA Baseboard
#@SOC: ls102xa
#@DESCRIPTION: Machine configuration for TQ-Systems GmbH TQMLS102xA
#@MAINTAINER: Markus Niebel <oss@ew.tq-group.com>
#
# By default, this machine will build for the full featured option
# with SD / eMMC boot
#
# To build U-Boot for other CPU or memory combinations, you can set
# the UBOOT_MACHINE variable in your local.conf according to the
# following table:
#
# Processor    Memory / Options        Boot Device     Configuration
# ---------    ----------------        -----------     -------------------------------------------
# LS1021A      1024MiB / RGMII         SD / e-MMC      tqmls102xa_mbls102xa_mmcsd_defconfig
# LS1021A      1024MiB / RGMII         QSPI NOR        tqmls102xa_mbls102xa_qspi_defconfig
# LS1021A      1024MiB / CAN           SD / e-MMC      tqmls102xa_mbls102xa_mmcsd_defconfig
# LS1021A      1024MiB / CAN           QSPI NOR        tqmls102xa_mbls102xa_qspi_defconfig
# LS1021A      1024MiB / SAI           SD / e-MMC      tqmls102xa_mbls102xa_mmcsd_defconfig
# LS1021A      1024MiB / SAI           QSPI NOR        tqmls102xa_mbls102xa_qspi_defconfig
# LS1021A      1024MiB / ECC / RGMII   QSPI NOR        tqmls102xa_mbls102xa_ecc_qspi_defconfig
# LS1021A      1024MiB / ECC / RGMII   SD / e-MMC      tqmls102xa_mbls102xa_ecc_mmcsd_defconfig
# LS1021A      1024MiB / ECC / CAN     QSPI NOR        tqmls102xa_mbls102xa_ecc_qspi_defconfig
# LS1021A      1024MiB / ECC / CAN     SD / e-MMC      tqmls102xa_mbls102xa_ecc_mmcsd_defconfig
# LS1021A      2048MiB / ECC / CAN     QSPI NOR        tqmls1021a-ae_mbls102xa_ecc_qspi_defconfig
# LS1021A      2048MiB / ECC / RGMII   QSPI NOR        tqmls1021a-ae_mbls102xa_ecc_qspi_defconfig
# Note: The RCW is not built within u-boot, but in 'rcw' package. This the bootstream needs
# to be created separately

require conf/machine/include/tqmls102xa.inc
require conf/machine/include/tq-machine.inc

# no default assignment here, since we overwrite defaults from qoriq-arm64.inc
SERIAL_CONSOLES = "115200;ttyS0"
SERIAL_CONSOLES_CHECK = "${SERIAL_CONSOLES}"
# disable virtual console support for this board and limit getty to SERIAL_CONSOLES only
USE_VT = "0"

KERNEL_DEVICETREE ?= "\
    nxp/ls/ls1021a-tqmls1021a-mbls1021a.dtb \
    nxp/ls/ls1021a-tqmls1021a-mbls1021a-hdmi.dtb \
    nxp/ls/ls1021a-tqmls1021a-mbls1021a-lvds-tm070jvhg33.dtb \
    nxp/ls/ls1021a-tqmls1021a-mbls1021a-rgb-cdtech-dc44.dtb \
    nxp/ls/ls1021a-tqmls1021a-mbls1021a-rgb-cdtech-fc21.dtb \
"

QE_UCODE = "iram_Type_A_LS1021a_r1.0.bin"

# Files are needed in IMAGE_BOOT_FILES because we use an extra partition for
# backward compatibility.
IMAGE_BOOT_FILES = "\
    ${KERNEL_IMAGETYPE};linuximage \
    ${@create_image_boot_dtb_files(d)} \
"

MACHINE_FEATURES:append = "\
    screen \
"

# Config names must not be a substring of other configs name , e.g. just 'sd' because this matches 'rgmii_sd' as well.
# '_ecc' are special variants which use the base RCW file, so this suffix is ignored when matching.
# 'ae_' are special variants which use the base RCW file, but with 1200 MHz config, so this suffix is ignored when matching
# config names need to match RCW file name, e.g. a grep on '_${config}' needs to succeed
UBOOT_CONFIG ??= "\
    ae_can_qspi_ecc \
    ae_rgmii_qspi_ecc \
    can_qspi \
    can_qspi_ecc \
    can_sd \
    can_sd_ecc \
    rgmii_qspi \
    rgmii_qspi_ecc \
    rgmii_sd \
    rgmii_sd_ecc \
    sai_qspi \
    sai_sd \
"

UBOOT_CONFIG[ae_can_qspi_ecc] = "tqmls1021a-ae_mbls102xa_ecc_qspi_defconfig"
UBOOT_CONFIG_IMAGE_FSTYPES[ae_can_qspi_ecc] = "ubi"
UBOOT_CONFIG[ae_rgmii_qspi_ecc] = "tqmls1021a-ae_mbls102xa_ecc_qspi_defconfig"
UBOOT_CONFIG_IMAGE_FSTYPES[ae_rgmii_qspi_ecc] = "ubi"
UBOOT_CONFIG[can_qspi] = "tqmls102xa_mbls102xa_qspi_defconfig"
UBOOT_CONFIG_IMAGE_FSTYPES[can_qspi] = "ubi"
UBOOT_CONFIG[can_qspi_ecc] = "tqmls102xa_mbls102xa_ecc_qspi_defconfig"
UBOOT_CONFIG_IMAGE_FSTYPES[can_qspi_ecc] = "ubi"
UBOOT_CONFIG[can_sd] = "tqmls102xa_mbls102xa_mmcsd_defconfig"
UBOOT_CONFIG[can_sd_ecc] = "tqmls102xa_mbls102xa_ecc_mmcsd_defconfig"
UBOOT_CONFIG[rgmii_qspi] = "tqmls102xa_mbls102xa_qspi_defconfig"
UBOOT_CONFIG_IMAGE_FSTYPES[rgmii_qspi] = "ubi"
UBOOT_CONFIG[rgmii_qspi_ecc] = "tqmls102xa_mbls102xa_ecc_qspi_defconfig"
UBOOT_CONFIG_IMAGE_FSTYPES[rgmii_qspi_ecc] = "ubi"
UBOOT_CONFIG[rgmii_sd] = "tqmls102xa_mbls102xa_mmcsd_defconfig"
UBOOT_CONFIG[rgmii_sd_ecc] = "tqmls102xa_mbls102xa_ecc_mmcsd_defconfig"
UBOOT_CONFIG[sai_qspi] = "tqmls102xa_mbls102xa_qspi_defconfig"
UBOOT_CONFIG_IMAGE_FSTYPES[sai_qspi] = "ubi"
UBOOT_CONFIG[sai_sd] = "tqmls102xa_mbls102xa_mmcsd_defconfig"


UBOOT_RCW_VARIANTS ?= "\
    default/rcw_can_qspi \
    default/rcw_can_sd \
    default/rcw_rgmii_qspi \
    default/rcw_rgmii_sd \
    default/rcw_sai_qspi \
    default/rcw_sai_sd \
"
