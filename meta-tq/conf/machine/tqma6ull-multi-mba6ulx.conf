#@TYPE: Machine
#@NAME: TQ-Systems GmbH TQMa6ULLx[L] SOM with 256 / 512 MB RAM on MBa6ULx baseboard
#@SOC: i.MX6ULL
#@DESCRIPTION: Machine configuration for TQ-Systems GmbH TQMaULLx[L]
#@MAINTAINER: Markus Niebel <oss@ew.tq-group.com>

include conf/machine/include/tqma6ull.inc
include conf/machine/include/mba6ulx-common.inc

KERNEL_DEVICETREE = "\
    nxp/imx/imx6ull-tqma6ull2-mba6ulx.dtb \
    nxp/imx/imx6ull-tqma6ull2l-mba6ulx.dtb \
"

KERNEL_DEVICETREE_linux-tq = "\
    nxp/imx/imx6ull-tqma6ull2-mba6ulx-cdtech-dc44.dtb \
    nxp/imx/imx6ull-tqma6ull2-mba6ulx-cdtech-fc21.dtb \
    nxp/imx/imx6ull-tqma6ull2-mba6ulx-lvds.dtb \
    nxp/imx/imx6ull-tqma6ull2l-mba6ulx-cdtech-dc44.dtb \
    nxp/imx/imx6ull-tqma6ull2l-mba6ulx-cdtech-fc21.dtb \
    nxp/imx/imx6ull-tqma6ull2l-mba6ulx-lvds.dtb \
"

KERNEL_DEVICETREE += "${@kernel_provider_dtbs(d)}"

UBOOT_CONFIG ?= "\
    sd \
    256mb_sd 256mb_qspi \
    256mb_sd_lga 256mb_qspi_lga \
    512mb_sd 512mb_qspi \
    512mb_sd_lga 512mb_qspi_lga \
    "

UBOOT_CONFIG[sd] = "tqma6ullx_mba6ul_mmc_defconfig,wic"

# Temporary fix, to be deleted after U-Boot update
MACHINE_WKS_BOOTSTREAM = "u-boot-${MACHINE}.imx-sd"

UBOOT_CONFIG[256mb_sd] = "tqma6ullx_mba6ul_mmc_defconfig"
UBOOT_CONFIG[256mb_qspi] = "tqma6ullx_mba6ul_qspi_defconfig"

UBOOT_CONFIG[256mb_sd_lga] = "tqma6ullxl_mba6ul_mmc_defconfig"
UBOOT_CONFIG[256mb_qspi_lga] = "tqma6ullxl_mba6ul_qspi_defconfig"

UBOOT_CONFIG[512mb_sd] = "tqma6ullx_512mb_mba6ul_mmc_defconfig"
UBOOT_CONFIG[512mb_qspi] = "tqma6ullx_512mb_mba6ul_qspi_defconfig"

UBOOT_CONFIG[512mb_sd_lga] = "tqma6ullxl_512mb_mba6ul_mmc_defconfig"
UBOOT_CONFIG[512mb_qspi_lga] = "tqma6ullxl_512mb_mba6ul_qspi_defconfig"

# allow creating multiple wic images for a single machine
IMAGE_CLASSES += "gen_additional_wic"

EXTWIC_BOOTLOADER_IMAGES = "\
    u-boot-${MACHINE}.imx-256mb_sd \
    u-boot-${MACHINE}.imx-512mb_sd \
    u-boot-${MACHINE}.imx-256mb_sd_lga \
    u-boot-${MACHINE}.imx-512mb_sd_lga \
"
