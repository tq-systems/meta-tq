#@TYPE: Machine
#@NAME: TQ-Systems TQMa67xx Module on MBa67xx Baseboard
#@SOC: AM67xx
#@DESCRIPTION: Machine configuration for TQ-Systems TQMa67xx

require conf/machine/include/tqma67xx.inc
require conf/machine/include/tq-machine.inc

KERNEL_DEVICETREE = " \
    ti/k3-am67a-tqma67xx-mba67xx.dtb \
    ti/k3-am67a-tqma67xx-mba67xx-csi0-imx327.dtbo \
    ti/k3-am67a-tqma67xx-mba67xx-csi0-ov9281.dtbo \
