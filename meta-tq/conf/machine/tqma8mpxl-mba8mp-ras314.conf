#@TYPE: Machine
#@NAME: i.MX 8MP TQMa8MP[Q,D,S[L]]L on MBa8MP-RAS314
#@DESCRIPTION: i.MX 8MP MBa8MP-RAS314 SBC
#@MAINTAINER: Markus Niebel <oss@ew.tq-group.com>
#
# Processor                     Memory     Configuration
# --------------                ------     --------------------------------------
# i.MX8MP[Q,D,S][L]             1,2,8 GiB  tqma8mpxl_multi_mba8mp_ras314_defconfig

require conf/machine/include/tqma8mpxl.inc
require conf/machine/include/tq-machine.inc

# Set u-boot DTB, needed for boot image construction
UBOOT_DTB_NAME = "imx8mp-tqma8mpql-mba8mp-ras314.dtb"

KERNEL_DEVICETREE = "\
    freescale/imx8mp-tqma8mpql-mba8mp-ras314.dtb \
"

# no support for linux-imx-tq and older versions of linux-tq / linux-rt_tq
PREFERRED_VERSION_linux-imx-tq ?= "none"
PREFERRED_VERSION_linux-tq ?= "6.12.%"
PREFERRED_VERSION_linux-rt_tq ?= "6.12.%"

# Do not automatically load the btnxpuart driver due to firmware load via PCIe
KERNEL_MODULE_PROBECONF += "btnxpuart"
module_conf_btnxpuart ?= "blacklist btnxpuart"

# Set this, if multiple kernels with different dtb names need to be supported
# KERNEL_DEVICETREE += "${@kernel_provider_dtbs(d)}"

UBOOT_CONFIG ??= "\
    ecc \
    uuu \
    sd \
"

UBOOT_CONFIG[ecc] = "tqma8mpxl_multi_mba8mp_ras314_ecc_defconfig"
UBOOT_CONFIG[sd] = "tqma8mpxl_multi_mba8mp_ras314_defconfig,wic"
UBOOT_CONFIG[uuu] = "tqma8mpxl_multi_mba8mp_ras314_uuu_defconfig"

MACHINE_FEATURES += "\
    bluetooth \
    camera \
    screen \
    wifi \
"

MACHINE_EXTRA_RRECOMMENDS += "${@bb.utils.contains('COMBINED_FEATURES', 'bluetooth', 'linux-firmware-pcie8997', '', d)}"
MACHINE_EXTRA_RRECOMMENDS += "${@bb.utils.contains('COMBINED_FEATURES', 'wifi', 'linux-firmware-pcie8997', '', d)}"

# Set Serial console @ UART4
SERIAL_CONSOLES = "115200;ttymxc3"
# recipe imx-atf-tq: boot / debug UART address for UART4
ATF_IMX_BOOT_UART_BASE ?= "0x30a60000"

# disable virtual console support for this board and limit getty to SERIAL_CONSOLES only
USE_VT = "0"

# SD boot image and FlexSPI boot image can be built using same U-Boot config
IMXBOOT_TARGETS ?= "\
    flash_evk_flexspi \
    flash_spl_uboot \
"

#
# TODO: revisit memory layout for optee support
#
# fitImage Settings:
# Kernel image offset in RAM:               64 MiB
# reserved space for uncompressed kernel:   48 MiB
# fdt/dtb offset in RAM:                    112 MiB
# dtbo offset in RAM:                       113 MiB
# init(rd) offset in RAM:                   128 MiB
UBOOT_ENTRYPOINT:mx8m-generic-bsp = "0x44000000"
UBOOT_LOADADDRESS:mx8m-generic-bsp = "0x44000000"
UBOOT_DTB_LOADADDRESS:mx8m-generic-bsp = "0x47000000"
UBOOT_DTBO_LOADADDRESS:mx8m-generic-bsp = "0x4710000"
UBOOT_RD_LOADADDRESS:mx8m-generic-bsp = "0x48000000"
UBOOT_RD_ENTRYPOINT:mx8m-generic-bsp = "0x48000000"

UBOOT_EXTLINUX_FDTDIR ?= ""

UBOOT_EXTLINUX_LABELS ?= " \
    default \
"

UBOOT_EXTLINUX_DEFAULT_LABEL ?= "default"
UBOOT_EXTLINUX_KERNEL_IMAGE_default = "../fitImage"
UBOOT_EXTLINUX_MENU_DESCRIPTION_default = "${DISTRO_NAME} on ${MACHINE} (default)"

require conf/machine/include/tq-distroboot.inc
