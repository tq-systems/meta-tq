#@TYPE: Machine
#@NAME: i.MX 8MP TQMa8MP[Q,D,S[L]]L on MBa8MP-RAS314
#@DESCRIPTION: i.MX 8MP MBa8MP-RAS314 SBC
#@MAINTAINER: Markus Niebel <oss@ew.tq-group.com>
#
# Processor                     Memory     Configuration
# --------------                ------     --------------------------------------
# i.MX8MP[Q,D,S][L]             1,2,8 GiB  tqma8mpxl_multi_mba8mp_ras314_defconfig

require conf/machine/include/tqma8mpxl.inc
require conf/machine/include/mba8-common.inc

# Set u-boot DTB, needed for boot image construction
UBOOT_DTB_NAME = "imx8mp-tqma8mpql-mba8mp-ras314.dtb"

KERNEL_DEVICETREE = "\
    freescale/imx8mp-tqma8mpql-mba8mp-ras314.dtb \
"

# Set this, if multiple kernels with different dtb names need to be supported
# KERNEL_DEVICETREE += "${@kernel_provider_dtbs(d)}"

UBOOT_CONFIG ??= "\
    mfgtool \
    sd \
"

UBOOT_CONFIG[sd] = "tqma8mpxl_multi_mba8mp_ras314_defconfig,wic"
UBOOT_CONFIG[mfgtool] = "tqma8mpxl_multi_mba8mp_ras314_defconfig"

MACHINE_FEATURES += "\
    bluetooth \
    camera \
    screen \
    touchscreen \
    wifi \
"

MACHINE_EXTRA_RRECOMMENDS += "${@bb.utils.contains('COMBINED_FEATURES', 'wifi', 'linux-firmware-ath10k', '', d)}"
MACHINE_EXTRA_RRECOMMENDS += "${@bb.utils.contains('COMBINED_FEATURES', 'bluetooth', 'linux-firmware-qca', '', d)}"

# Set Serial console @ UART4
SERIAL_CONSOLES = "115200;ttymxc3"
# recipe imx-atf-tq: boot / debug UART address for UART4
ATF_IMX_BOOT_UART_BASE ?= "0x30a60000"

# disable virtual console support for this board and limit getty to SERIAL_CONSOLES only
USE_VT = "0"

# SD boot image and FlexSPI boot image can be built using same U-Boot config
IMXBOOT_TARGETS ?= "\
    flash_evk_flexspi \
    flash_spl_uboot \
"

#
# bootstream name, construction see imx-boot recipe, do_deploy
#
MACHINE_WKS_BOOTSTREAM ?= "imx-boot-${MACHINE}-sd.bin-flash_spl_uboot"

WKS_FILE = "tqmaxx-imx-v8-sdimg${@bb.utils.contains('DISTRO_FEATURES', 'rauc', '-rauc-ab', '', d)}.wks.in"

KERNEL_IMAGETYPE = "fitImage"
KERNEL_IMAGETYPE:mx8m-generic-bsp = "fitImage"
KERNEL_IMAGETYPES = "${KERNEL_IMAGETYPE}"
KERNEL_CLASSES += "kernel-fitimage"
UBOOT_EXTLINUX_FDTDIR ?= ""

#
# fitImage Settings:
# Kernel image offset in RAM:               16 MiB
# reserved space for uncompressed kernel:   48 MiB
# fdt/dtb offset in RAM:                    64 MiB
# dtbo offset in RAM:                       65 MiB
# init(rd) offset in RAM:                   80 MiB
# (loadaddr                                512 MiB)
# (optee offset                       256 + 96 MiB)
# (optee size                               32 MiB)
FIT_KERNEL_COMP_ALG = "none"
UBOOT_ENTRYPOINT = "0x41000000"
UBOOT_LOADADDRESS = "0x41000000"
UBOOT_DTB_LOADADDRESS = "0x44000000"
UBOOT_DTBO_LOADADDRESS = "0x4410000"

UBOOT_RD_LOADADDRESS = "0x45000000"
UBOOT_RD_ENTRYPOINT = "0x45000000"

UBOOT_EXTLINUX_LABELS ?= " \
    default \
"
UBOOT_EXTLINUX_DEFAULT_LABEL ?= "default"

UBOOT_EXTLINUX_KERNEL_IMAGE_default = "../fitImage"
UBOOT_EXTLINUX_MENU_DESCRIPTION_default = "${DISTRO_NAME} on ${MACHINE} (default)"

require conf/machine/include/tq-distroboot.inc
