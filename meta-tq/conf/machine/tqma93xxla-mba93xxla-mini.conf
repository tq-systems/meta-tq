#@TYPE: Machine
#@NAME: i.MX93 TQMa93xxLA on MBa93xxLA-MINI
#@DESCRIPTION: TQ-Systems GmbH i.MX93 MBa93xxLA-MINI SBC
#@MAINTAINER: Martin Schmiedel <oss@ew.tq-group.com>

require conf/machine/include/tqma93xx.inc
require conf/machine/include/mba93xx-common.inc

MACHINE_FEATURES += "\
    lte \
"

UBOOT_CONFIG ??= "\
    ecc \
    sd \
    uuu \
"

UBOOT_CONFIG[ecc] = "tqma93xx_mba93xxla_mini_ecc_defconfig"
UBOOT_CONFIG[sd] = "tqma93xx_mba93xxla_mini_defconfig"
UBOOT_CONFIG_IMAGE_FSTYPES[sd] = "wic"
UBOOT_CONFIG[uuu] = "tqma93xx_mba93xxla_mini_uuu_defconfig"

KERNEL_DEVICETREE_linux-tq = "\
    freescale/imx93-tqma9352-mba93xxla-mini.dtb \
    freescale/imx93-tqma9352-mba93xxla-mini-lvds-tm070jvhg33.dtb \
    freescale/imx93-tqma9352-mba93xxla-mini-ezurio-wlan.dtb \
    freescale/imx93-tqma9352-mba93xxla-lvds-tm070jvhg33.dtbo \
    freescale/imx93-tqma9352-mba93xxla-mini-ezurio-wlan.dtbo \
"

KERNEL_DEVICETREE_linux-rt-tq = "${KERNEL_DEVICETREE_linux-tq}"

KERNEL_DEVICETREE += "${@kernel_provider_dtbs(d)}"

# Set the USB UART of the wwan card inserted into mini PCIe slot. Use this UART
# to send AT commands to the wwan card (see quectel-ppp recipe). This assignment
# must not contain spaces and line feeds.
# QUECTEL_PPP_TTY = "/dev/serial/by-id/usb-Quectel_Incorporated_LTE_Module-if02-port0"

# This example shows the APN to be used for NXTGN IoT SIM cards. Please uncomment
# and override with the the string needed for your provider.
# For further information see README in doc folder of this layer.
# QUECTEL_PPP_APN ?= "h.nxtgn"

#
# fitImage Settings:
# Kernel image offset in RAM:               16 MiB
# reserved space for uncompressed kernel:   48 MiB
# fdt/dtb offset in RAM:                    64 MiB
# dtbo offset in RAM:                       65 MiB
# init(rd) offset in RAM:                   80 MiB
# (loadaddr                                512 MiB)
# (optee offset                       256 + 96 MiB)
# (optee size                               32 MiB)
UBOOT_ENTRYPOINT = "0x81000000"
UBOOT_LOADADDRESS = "0x81000000"
UBOOT_DTB_LOADADDRESS = "0x84000000"
UBOOT_DTBO_LOADADDRESS = "0x84100000"
UBOOT_RD_LOADADDRESS = "0x85000000"
UBOOT_RD_ENTRYPOINT = "0x85000000"

UBOOT_EXTLINUX_FDTDIR ?= ""

UBOOT_EXTLINUX_LABELS ?= " \
    default \
"

EXTRA_EXTLINUX_LABELS ?= " \
    lvds-tm070jvhg33 \
    ezurio-wlan \
"

EXTRA_EXTLINUX_LABELS:mx93-nxp-bsp = ""

UBOOT_EXTLINUX_LABELS += "${EXTRA_EXTLINUX_LABELS}"

UBOOT_EXTLINUX_DEFAULT_LABEL ?= "default"
UBOOT_EXTLINUX_KERNEL_IMAGE_default = "../fitImage"
UBOOT_EXTLINUX_MENU_DESCRIPTION_default = "${DISTRO_NAME} on ${MACHINE} (default)"

UBOOT_EXTLINUX_KERNEL_IMAGE_lvds-tm070jvhg33 = \
    "../fitImage#${FIT_CONF_PREFIX}imx93-tqma9352-mba93xxla-mini.dtb#${FIT_CONF_PREFIX}imx93-tqma9352-mba93xxla-lvds-tm070jvhg33.dtbo"
UBOOT_EXTLINUX_MENU_DESCRIPTION_lvds-tm070jvhg33 = \
    "${DISTRO_NAME} on ${MACHINE} (LVDS display: TM070JDHG30)"
UBOOT_EXTLINUX_KERNEL_IMAGE_ezurio-wlan = \
    "../fitImage#${FIT_CONF_PREFIX}imx93-tqma9352-mba93xxla-mini.dtb#${FIT_CONF_PREFIX}imx93-tqma9352-mba93xxla-mini-ezurio-wlan.dtbo"
UBOOT_EXTLINUX_MENU_DESCRIPTION_ezurio-wlan = \
    "${DISTRO_NAME} on ${MACHINE} (WLAN Module Ezurio: LWB5+ M.2)"

require conf/machine/include/tq-distroboot.inc
